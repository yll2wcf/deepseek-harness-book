<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760">
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif} .node{font-size:19px;font-weight:600;fill:#111827}.sub{font-size:13px;fill:#475569}</style>
<defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
<rect width="960" height="760" fill="white"/>
<text x="480" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Profile、Bundle、Patch 怎样组成应用</text>
<text x="480" y="90" text-anchor="middle" font-size="15" fill="#64748b">按三行顺序阅读；具体插件数量由当前组合决定</text>
<text x="48" y="140" font-size="16" font-weight="600" fill="#334155">① 应用选择</text>
<rect x="48" y="160" width="240" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="168" y="202" text-anchor="middle" class="node">dsh Profile</text>
<text x="168" y="236" text-anchor="middle" class="sub">选择命名运行组合</text>
<path d="M288 212 L352 212" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="360" y="160" width="240" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="480" y="202" text-anchor="middle" class="node">Bundle layers</text>
<text x="480" y="236" text-anchor="middle" class="sub">按配置顺序展开分发层</text>
<path d="M600 212 L664 212" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="672" y="160" width="240" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="792" y="202" text-anchor="middle" class="node">Profile patch</text>
<text x="792" y="236" text-anchor="middle" class="sub">应用本Profile覆盖</text>
<text x="48" y="320" font-size="16" font-weight="600" fill="#334155">② 后续覆盖</text>
<rect x="48" y="340" width="240" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="168" y="382" text-anchor="middle" class="node">Home patch</text>
<text x="168" y="416" text-anchor="middle" class="sub">$DSH_HOME/cordis.patch.yml</text>
<path d="M288 392 L352 392" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="360" y="340" width="240" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="480" y="382" text-anchor="middle" class="node">--patch overlays</text>
<text x="480" y="416" text-anchor="middle" class="sub">按命令行顺序继续覆盖</text>
<path d="M600 392 L664 392" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="672" y="340" width="240" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="792" y="382" text-anchor="middle" class="node">遥测禁用Patch</text>
<text x="792" y="416" text-anchor="middle" class="sub">环境开关适用时最后覆盖</text>
<text x="48" y="500" font-size="16" font-weight="600" fill="#334155">③ 装配与生命周期</text>
<rect x="48" y="520" width="240" height="104" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
<text x="168" y="562" text-anchor="middle" class="node">composeEntries()</text>
<text x="168" y="596" text-anchor="middle" class="sub">按行id组合；config整体替换</text>
<path d="M288 572 L352 572" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="360" y="520" width="240" height="104" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
<text x="480" y="562" text-anchor="middle" class="node">App Boot</text>
<text x="480" y="596" text-anchor="middle" class="sub">解析并检查加载结果</text>
<path d="M600 572 L664 572" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="672" y="520" width="240" height="104" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
<text x="792" y="562" text-anchor="middle" class="node">Cordis plugins</text>
<text x="792" y="596" text-anchor="middle" class="sub">服务与监听器归生命周期管理</text>
<text x="48" y="722" font-size="12" fill="#64748b">箭头：本行的概念或数据关系；逐行展开不同责任</text>
<text x="912" y="722" text-anchor="end" font-size="12" fill="#64748b">源码基线 e8f7b93a34 · 2026-11-13</text>
